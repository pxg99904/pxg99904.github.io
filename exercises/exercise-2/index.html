<!DOCTYPE html>
<html lang="en">
<head>
<style>
      #holder{
        width:500px;
        height:500px;
        background-color: rgb(250, 250, 250); outline: 10px solid rgb(187, 186, 186);
        position: relative;
        z-index: 1;
    }
    #square1{
        width:150px;
        height:150px;
        background-color: rgb(237, 92, 97);
        position: absolute;
        left: 95px;
        top: 95px;
        z-index: 2;
    }
    #square2{
        width:150px;
        height:150px;
        background-color: rgb(64, 61, 169);
        position: absolute;
        bottom: 180px;
        right: 180px;
        z-index: 3;
    }
     #square3{
        width:150px;
        height:150px;
        background-color: rgb(180, 197, 95);
        position: absolute;
        bottom: 110px;
        right: 110px;
        z-index: 4;
    }
    #center {
  display: flex;
  justify-content: center;
  align-items: center;
}
</style>
</head>
<body>
    <div id="holder"> 
        <div id="square1"></div>
        <div id="square2"></div>
        <div id="square3"></div>
</body>
</html>
