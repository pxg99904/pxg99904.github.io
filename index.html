<!DOCTYPE html>
<html lang="en">
<head>
<style>
* {
  box-sizing: border-box;
}
.img-container {
  float: left;
  width: 33.33%;
  padding: 5px;
}
.clearfix::after {
  content: "";
  clear: both;
  display: table;
}
body
{
  background-color: beige;
}
h1 {text-align: center; font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif; color: darkslategray; font-size: xx-large;}
h2 {text-align: center; font-family: Arial, Helvetica, sans-serif; color: darkslategray; font-size: smaller;}
p {text-align: center; font-family: Arial, Helvetica, sans-serif; color: darkslategray;}
div {text-align: center; font-family: 'Times New Roman', Times, serif; color: darkslategray;}
figure {
  border: 1px #cccccc solid;
  padding: 4px;
  margin: auto;
}
</style>
</head>
<body>
    <h1>Paxton Graybill</h1>
    <h2>Web Design - 26'/27'</h2>
<div class="clearfix">

  </div>
  <div class="img-container">
  <img src="images/art-show-solo.jpg" alt="woman standing in front of artwork at art show" style="width:100%"> <caption>Pax at her debut solo show, LancGallery, 2023</caption>
  </div>
  <div class="img-container">
  <img src="images/paddle-board-raystown.JPG" alt="image taken at raystown lake with mountains in background, woman on paddle board" style="width:100%"> <caption>Pax enjoys recreation at Raystown Lake!</caption>
  </div>
</div>

</html>
