<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charade Microsite</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <header>
        <a class="brand" href="../../projects/project2/instructional-site.html">
            <img class="brand-logo" src="../../projects/project2/images/white-art-icon.svg" alt="Artists Resource logo">
            <h1>Charade</h1>
        </a>
        <nav>
            <ul>
                <li><a href="#">Watch Now</a></li>
                <li><a href="#">Learn More</a></li>
            </ul>
        </nav>
    </header>
    <main class="container py-4">
        <h2>Charade</h2>
        <p>Welcome to the Charade microsite.</p>
        <div class="row row-cols-auto">
            <div class="col">Column</div>
            <div class="col">Column</div>
            <div class="col">Column</div>
            <div class="col">Column</div>
        </div>
    </main>
    <div id="carouselStackedIndicators" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner rounded-5">
            <div class="carousel-item active">
                <img src="./images/screencap-3.avif" class="d-block w-100" alt="screencap featuring actors in charade movie">
            </div>
            <div class="carousel-item">
                <img src="./images/screencap-2.webp" class="d-block w-100" alt="screencap featuring actors in charade movie">
            </div>
            <div class="carousel-item">
                <img src="./images/screencap-4.jpeg" class="d-block w-100" alt="screencap featuring actors in charade movie">
            </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mt-3">
            <div>
                <button class="btn btn-outline-secondary btn-sm" type="button" data-bs-target="#carouselStackedIndicators" data-bs-slide="prev" aria-label="Previous slide">
                    <span aria-hidden="true">&lsaquo;</span>
                </button>
                <button class="btn btn-outline-secondary btn-sm" type="button" data-bs-target="#carouselStackedIndicators" data-bs-slide="next" aria-label="Next slide">
                    <span aria-hidden="true">&rsaquo;</span>
                </button>
            </div>

            <div class="carousel-indicators">
                <button type="button" data-bs-target="#carouselStackedIndicators" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
                <button type="button" data-bs-target="#carouselStackedIndicators" data-bs-slide-to="1" aria-label="Slide 2"></button>
                <button type="button" data-bs-target="#carouselStackedIndicators" data-bs-slide-to="2" aria-label="Slide 3"></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
