<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exercise 2</title>
</head>
<body>
    <div class="canvas">
        <div class="square-1"></div>
        <div class="square-2"></div>
        <div class="square-3"></div>
    </div>
</div>
<style>
    .canvas{
        width: 100%;
        height: 100%;
        position: relative;
    }
  .square-1{
        width:100px;
        height:100px;
        background-color: rgb(195, 106, 106);
        position: absolute;
        left: 0;
        top: 0;
        z-index: 1;
    }
    .square-2{
        width:100px;
        height:100px;
        background-color: rgb(98, 143, 212);
        position: absolute;
        bottom: -145px;
        right: 290px;
        z-index: 2;
    }
    .square-3{
        width:100px;
        height:100px;
        background-color: rgb(100, 173, 100);
        position: absolute;
        top:95px;
        right:240px;
        z-index: 3;
    }
 </style>
</body>
</html>
