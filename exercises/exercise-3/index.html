<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Assignment 3</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css"
    />
    <style>
     body{ width: 100%; background-color: rgb(83, 83, 81);}
     #site-header{height: 100px; width: 100%; background-color: rgb(250, 248, 248); position: relative; margin: 0 auto;}
    #square3 { position: absolute; }
     #holder{
        width: 1000px;
        min-height:500px;
        background-color: rgb(250, 250, 250);
        position: relative; 
        margin: 0 auto;
        margin-top: 50px; 
        border-radius: 10px;
     }
        #holder > .flex,
        main,
        #content,
        footer {
          width: 100%;
        }
     div {
          border: 1px solid rgb(92, 91, 91);
          text-align: center;
          height: 100px;
        }
      .row {
        display: flex;
        width: 100%;
      }
      .col-100 {
        flex: 0 100%;
        width: 100%;
      }
        .col-a {
          flex:70%;
            width: 70%;  
        }
        .col-b {
          flex:30%;
            width: 30%;
        }
        .col-50 {
          flex:50%;
            width: 50%;
        }
        .col-33 {
          flex:33.33%;
            width: 33.33%;
        }
           .flex {
            display: flex;
        }
    </style>
  </head>
  <body>
    <header id="site-header">
        <div id="square3"></div>
      <div class="row">
        <div class="col-100">
          header: col-100<br />This entire layout is 1440px wide
        </div>
      </div>
    </header>
    <div id="holder">
    <div class="flex">
      <main>
      <div id="content">
        <div class="row">
          <div class="col-a">col-a</div>
          <div class="col-b">col-b<br />(width 200px)</div>
        </div>
        <div class="row">
          <div class="col-50">col-50</div>
          <div class="col-50">col-50</div>
        </div>
        <div class="row">
          <div class="col-33">col-33</div>
          <div class="col-33">col-33</div>
          <div class="col-33">col-33</div>
        </div>
        <div class="row">
          <div class="col-100">footer: col-100</div>
        </div>
      </div>
      </main>
    </div>
    </div>
  </body>
</html>
