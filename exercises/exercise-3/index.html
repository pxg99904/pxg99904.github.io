<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Exercise 3</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css"
    />
    <style>
        div {
          border: 1px solid black;
          text-align: center;
        }
      .col-100 {
        width: 1440px;
        height: 100px;
      }
        .col-a {
            width: 1240px;
            height: 100px;
        }
        .col-b {
            width: 200px;
            height: 100px;
        }
        .col-50 {
            width: 50%;
            height: 100px;
        }
        .col-33 {
            width: 33.33%;
            height: 100px;
        }
        .flex {
            display: flex;
        }
        .main {
            width: 1440px;
            background-color: lightgray;
        }
    </style>
  </head>
  <body>
    <header id="site-header">
      <div class="flex">
        <div class="col-100">
          header: col-100<br />This entire layout is 1440px wide
        </div>
      </div>
    </header>
    <main>
      <div id="content">
        <div class="flex">
          <div class="col-a">col-a</div>
          <div class="col-b">col-b<br />(width 200px)</div>
        </div>

        <div class="flex">
          <div class="col-50">col-50</div>
          <div class="col-50">col-50</div>
        </div>

        <div class="flex">
          <div class="col-33">col-33</div>
          <div class="col-33">col-33</div>
          <div class="col-33">col-33</div>
        </div>
      </div>

      <footer>
        <div class="flex">
          <div class="col-100">footer: col-100</div>
        </div>
      </footer>
    </main>
  </body>
</html>
