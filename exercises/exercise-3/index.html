<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title> Exercise 3</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css"
    />
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: rgb(83, 83, 81); }
      #site-header { height: 100px; background: rgb(250, 248, 248); position: relative; }
      #square3 { position: absolute; top: 20%; left: 20%; width: 60%; height: 50%; padding: 5px; border: 2px solid black; text-align: center; }
      #holder { width: 90%; min-height: 500px; margin: 50px auto 0; background: rgb(250, 250, 250); border-radius: 10px; overflow: hidden; }
      main { width: 100%; }
      div { height: 100px; border: 1px solid rgb(92, 91, 91); text-align: center; }
      .row { display: flex; }
      [class^="col-"] {
        display: flex;
        flex: 0 0 auto;
        align-items: center;
        justify-content: center;
      }
      .col-100 { width: 100%; }
      .col-a { width: 70%; }
      .col-b { width: 30%; }
      .col-50 { width: 50%; }
      .col-33 { width: 33.33%; }
    </style>

  </head>
  <body>
    <header id="site-header">
      <div id="square3"></div>
        <div class="col-100">
          header: col-100<br />This entire layout is 1440px wide
        </div>
    </header>
    <div id="holder">
      <main>
        <div class="row">
          <div class="col-a">col-a</div>
          <div class="col-b">col-b<br />(width 200px)</div>
        </div>
        <div class="row">
          <div class="col-50">col-50</div>
          <div class="col-50">col-50</div>
        </div>
        <div class="row">
          <div class="col-33">col-33</div>
          <div class="col-33">col-33</div>
          <div class="col-33">col-33</div>
        </div>
        <div class="row">
          <div class="col-100">footer: col-100</div>
        </div>
      </main>
    </div>
  </body>
</html>
